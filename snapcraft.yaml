name: devpack-for-go
title: Devpack for Go
version: '1.1'
summary: Current Go development tools in one maintained snap
description: |
  Devpack for Go packages current, tested releases of commonly used Go
  development tools: Delve, gopls, golangci-lint, govulncheck, gotests, and
  gofumpt.

  The tools use the Go installation selected by the user's PATH. The official
  Go snap is recommended, but Go installed through a distribution package,
  tarball, or version manager is also supported.

  After installation, run 'devpack-for-go setup' to configure an editor, or
  'devpack-for-go doctor' to inspect the detected Go toolchain and tools.

base: core24
confinement: classic
grade: stable
license: GPL-3.0-only
source-code: https://github.com/canonical/devpack-for-go
issues: https://github.com/canonical/devpack-for-go/issues
website: https://snapcraft.io/devpack-for-go
contact: https://github.com/canonical/devpack-for-go/issues

platforms:
  amd64:
  arm64:

build-snaps:
  - go/1.27/stable

environment:
  PATH: $SNAP/bin:$PATH

apps:
  devpack-for-go:
    command: bin/devpack-for-go

  setup:
    command: bin/devpack-for-go setup

  # Compatibility command from releases before the 1.1 redesign.
  setup-guide:
    command: bin/devpack-for-go setup

  # No automatic aliases are declared yet: every tool is available under its
  # snap-qualified name, devpack-for-go.<tool>. The store already has snaps
  # named gopls, golangci-lint, govulncheck, and gofumpt, and snapd grants each
  # snap use of its own name, so those four cannot be aliased here. dlv and
  # gotests are requested in https://forum.snapcraft.io/t/53706 and will be
  # declared once the store grants them.
  dlv:
    command: bin/dlv
    command-chain: [bin/with-go]

  # Keep the original qualified command available for existing users.
  delve:
    command: bin/dlv
    command-chain: [bin/with-go]

  gopls:
    command: bin/gopls
    command-chain: [bin/with-go]

  golangci-lint:
    command: bin/golangci-lint
    command-chain: [bin/with-go]

  govulncheck:
    command: bin/govulncheck
    command-chain: [bin/with-go]

  gotests:
    command: bin/gotests

  gofumpt:
    command: bin/gofumpt

  air:
    command: bin/air
    command-chain: [bin/with-go]

parts:
  devpack-cli:
    plugin: nil
    source: .
    override-build: |
      set -eu
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      CGO_ENABLED=0 GOTOOLCHAIN=local go build \
        -trimpath -ldflags="-s -w" \
        -o "$CRAFT_PART_INSTALL/bin/devpack-for-go" \
        ./cmd/devpack-for-go

  runtime:
    plugin: dump
    source: snap/local
    organize:
      with-go: bin/with-go
    stage:
      - bin/with-go

  dlv:
    plugin: nil
    source: internal/toolversions
    override-build: |
      set -eu
      . "$CRAFT_PART_SRC/versions.env"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      CGO_ENABLED=0 GOTOOLCHAIN=local GOBIN="$CRAFT_PART_INSTALL/bin" \
        go install -trimpath -ldflags="-s -w" \
        "github.com/go-delve/delve/cmd/dlv@$DLV_VERSION"
    stage:
      - bin/dlv

  gopls:
    plugin: nil
    source: internal/toolversions
    override-build: |
      set -eu
      . "$CRAFT_PART_SRC/versions.env"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      CGO_ENABLED=0 GOTOOLCHAIN=local GOBIN="$CRAFT_PART_INSTALL/bin" \
        go install -trimpath -ldflags="-s -w" \
        "golang.org/x/tools/gopls@$GOPLS_VERSION"
    stage:
      - bin/gopls

  golangci-lint:
    plugin: nil
    source: internal/toolversions
    override-build: |
      set -eu
      . "$CRAFT_PART_SRC/versions.env"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      CGO_ENABLED=0 GOTOOLCHAIN=local GOBIN="$CRAFT_PART_INSTALL/bin" \
        go install -trimpath -ldflags="-s -w" \
        "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
    stage:
      - bin/golangci-lint

  govulncheck:
    plugin: nil
    source: internal/toolversions
    override-build: |
      set -eu
      . "$CRAFT_PART_SRC/versions.env"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      CGO_ENABLED=0 GOTOOLCHAIN=local GOBIN="$CRAFT_PART_INSTALL/bin" \
        go install -trimpath -ldflags="-s -w" \
        "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
    stage:
      - bin/govulncheck

  gotests:
    plugin: nil
    source: internal/toolversions
    override-build: |
      set -eu
      . "$CRAFT_PART_SRC/versions.env"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      CGO_ENABLED=0 GOTOOLCHAIN=local GOBIN="$CRAFT_PART_INSTALL/bin" \
        go install -trimpath -ldflags="-s -w" \
        "github.com/cweill/gotests/gotests@$GOTESTS_VERSION"
    stage:
      - bin/gotests

  gofumpt:
    plugin: nil
    source: internal/toolversions
    override-build: |
      set -eu
      . "$CRAFT_PART_SRC/versions.env"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      CGO_ENABLED=0 GOTOOLCHAIN=local GOBIN="$CRAFT_PART_INSTALL/bin" \
        go install -trimpath -ldflags="-s -w" \
        "mvdan.cc/gofumpt@$GOFUMPT_VERSION"
    stage:
      - bin/gofumpt

  air:
    plugin: nil
    source: internal/toolversions
    override-build: |
      set -eu
      . "$CRAFT_PART_SRC/versions.env"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      CGO_ENABLED=0 GOTOOLCHAIN=local GOBIN="$CRAFT_PART_INSTALL/bin" \
        go install -trimpath -ldflags="-s -w" \
        "github.com/air-verse/air@$AIR_VERSION"
    stage:
      - bin/air
